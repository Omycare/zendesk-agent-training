<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formation Agent Zendesk - OmyCare</title>
<style>
:root {
  --purple: #6654C0;
  --purple-dark: #4A3A9A;
  --purple-light: #EDE9FF;
  --bg: #F5F3FF;
  --sidebar: #1C1B3A;
  --text: #1A1A2E;
  --text-light: #6B7280;
  --white: #FFFFFF;
  --success: #10B981;
  --error: #EF4444;
  --warning: #F59E0B;
  --border: #E5E7EB;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; font-size:15px; }

/* SIDEBAR */
.sidebar { width:270px; background:var(--sidebar); min-height:100vh; position:fixed; left:0; top:0; display:flex; flex-direction:column; z-index:100; overflow-y:auto; }
.sidebar-logo { padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,0.1); }
.sidebar-logo img { height:32px; }
.sidebar-label { color:rgba(255,255,255,0.4); font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-top:8px; display:block; }
.progress-wrap { padding:14px 18px; border-bottom:1px solid rgba(255,255,255,0.1); }
.progress-top { display:flex; justify-content:space-between; margin-bottom:6px; }
.progress-top span { color:rgba(255,255,255,0.5); font-size:11px; }
.progress-top strong { color:white; font-size:12px; }
.pbar { height:3px; background:rgba(255,255,255,0.1); border-radius:3px; }
.pbar-fill { height:100%; background:var(--purple); border-radius:3px; width:0%; transition:width .4s; }
.modules-nav { padding:10px 0; }
.mod-btn { display:flex; align-items:center; gap:10px; padding:10px 18px; color:rgba(255,255,255,0.6); font-size:13px; cursor:pointer; transition:all .2s; border:none; background:none; width:100%; text-align:left; }
.mod-btn:hover { color:white; background:rgba(255,255,255,0.06); }
.mod-btn.active { color:white; background:var(--purple); border-radius:0; }
.mod-btn.done .mod-icon { opacity:.5; }
.mod-icon { font-size:15px; width:22px; text-align:center; flex-shrink:0; }
.mod-name { flex:1; line-height:1.3; }
.mod-check { font-size:11px; color:var(--success); }
.lessons-sub { display:none; }
.mod-item.open .lessons-sub { display:block; }
.les-btn { display:flex; align-items:center; gap:8px; padding:7px 18px 7px 50px; color:rgba(255,255,255,0.45); font-size:12px; cursor:pointer; transition:all .2s; border:none; background:none; width:100%; text-align:left; }
.les-btn:hover { color:rgba(255,255,255,0.8); }
.les-btn.active { color:white; background:rgba(107,92,231,0.25); }
.les-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.2); flex-shrink:0; }
.les-btn.done .les-dot { background:var(--success); }
.les-btn.active .les-dot { background:var(--purple); }

/* MAIN */
.main { margin-left:270px; flex:1; display:flex; flex-direction:column; }
.topbar { background:white; padding:14px 36px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; box-shadow:0 1px 4px rgba(102,84,192,.08); }
.breadcrumb { font-size:13px; color:var(--text-light); }
.breadcrumb strong { color:var(--text); }
.lang-toggle { display:flex; gap:3px; background:var(--bg); padding:3px; border-radius:7px; }
.lang-btn { padding:5px 12px; border:none; border-radius:5px; font-size:12px; font-weight:700; cursor:pointer; background:transparent; color:var(--text-light); transition:all .2s; }
.lang-btn.active { background:var(--purple); color:white; }

/* CONTENT */
.content-area { padding:40px 48px; max-width:900px; width:100%; }
.lesson-tag { display:inline-flex; align-items:center; gap:6px; background:var(--purple-light); color:var(--purple); font-size:11px; font-weight:700; padding:4px 12px; border-radius:20px; margin-bottom:12px; text-transform:uppercase; letter-spacing:.5px; }
.lesson-title { font-size:26px; font-weight:800; margin-bottom:8px; line-height:1.2; }
.lesson-subtitle { color:var(--text-light); font-size:15px; line-height:1.6; margin-bottom:28px; }
.block { background:white; border-radius:12px; padding:24px 28px; margin-bottom:18px; border:1px solid var(--border); }
.block h3 { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.block p { color:var(--text-light); line-height:1.7; margin-bottom:8px; }
.block p:last-child { margin-bottom:0; }
.block ul { color:var(--text-light); line-height:1.7; padding-left:20px; }
.block ul li { margin-bottom:4px; }
.tip { background:var(--purple-light); border-left:4px solid var(--purple); border-radius:0 8px 8px 0; padding:12px 16px; margin:14px 0; }
.tip .tip-lbl { font-size:10px; font-weight:700; color:var(--purple); text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
.tip p { color:var(--purple-dark); font-size:13px; margin:0; }
.cards { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0; }
.card { background:var(--bg); border-radius:8px; padding:14px; border:1px solid var(--border); }
.card .ci { font-size:20px; margin-bottom:6px; }
.card .ct { font-size:13px; font-weight:700; margin-bottom:3px; }
.card .cd { font-size:12px; color:var(--text-light); line-height:1.4; }

/* STATUS BADGES */
.badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
.s-new { background:#FFF0D3; color:#92400E; }
.s-open { background:#FDECEA; color:#9B1C1C; }
.s-pending { background:#DBEAFE; color:#1E40AF; }
.s-hold { background:#E2E8F0; color:#1F2933; }
.s-solved { background:#F3F4F6; color:#374151; }
.s-closed { background:#E5E7EB; color:#6B7280; }

/* ZD MOCKUP */
.zd-mock { border:1px solid var(--border); border-radius:10px; overflow:hidden; margin:16px 0; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.zd-bar { background:#1F73B7; padding:8px 14px; display:flex; align-items:center; gap:8px; }
.zd-bar span { color:white; font-size:11px; font-weight:600; }
.zd-inner { display:grid; grid-template-columns:1fr 240px; min-height:220px; font-size:12px; }
.zd-main { padding:14px; border-right:1px solid var(--border); }
.zd-side { padding:14px; background:#F9FAFB; }
.zd-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.zd-lbl { font-size:10px; font-weight:700; color:var(--text-light); text-transform:uppercase; width:70px; flex-shrink:0; }
.zd-val { font-size:12px; color:var(--text); }
.zd-sel { border:1px solid var(--border); border-radius:4px; padding:4px 8px; font-size:11px; color:var(--text); background:white; cursor:pointer; }
.zd-tabs { display:flex; border-bottom:2px solid var(--border); margin-bottom:10px; }
.zd-tab { padding:6px 12px; font-size:11px; font-weight:600; color:var(--text-light); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; }
.zd-tab.active { color:var(--purple); border-bottom-color:var(--purple); }
.zd-textarea { border:1px solid var(--border); border-radius:5px; min-height:60px; padding:8px; font-size:12px; color:var(--text-light); background:white; width:100%; resize:none; }
.zd-actions { display:flex; gap:6px; padding:10px 14px; background:#F9FAFB; border-top:1px solid var(--border); }
.zd-btn { padding:6px 12px; border-radius:4px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:white; color:var(--text); transition:all .15s; }
.zd-btn:hover { border-color:var(--purple); color:var(--purple); }
.zd-btn.primary { background:var(--purple); color:white; border-color:var(--purple); }
.zd-btn.primary:hover { background:var(--purple-dark); }
.zd-btn.success { background:var(--success); color:white; border-color:var(--success); }
.zd-btn.clickable { animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(102,84,192,.4)} 50%{box-shadow:0 0 0 5px rgba(102,84,192,.0)} }

/* EXERCISE */
.exercise { background:white; border:2px solid var(--purple); border-radius:12px; padding:24px 28px; margin-top:22px; }
.ex-lbl { display:flex; align-items:center; gap:6px; font-size:10px; font-weight:700; color:var(--purple); text-transform:uppercase; letter-spacing:.5px; margin-bottom:14px; }
.ex-q { font-size:16px; font-weight:700; color:var(--text); margin-bottom:16px; line-height:1.4; }
.ex-ctx { background:var(--bg); border-radius:7px; padding:12px 14px; margin-bottom:16px; font-size:13px; color:var(--text-light); border-left:3px solid var(--purple-light); }
.options { display:flex; flex-direction:column; gap:8px; }
.opt { padding:12px 16px; border:2px solid var(--border); border-radius:8px; cursor:pointer; font-size:13px; color:var(--text); transition:all .2s; display:flex; align-items:center; gap:10px; }
.opt:hover { border-color:var(--purple); background:var(--purple-light); }
.opt.selected { border-color:var(--purple); background:var(--purple-light); }
.opt.correct { border-color:var(--success); background:#F0FDF4; color:#166534; pointer-events:none; }
.opt.wrong { border-color:var(--error); background:#FEF2F2; color:#991B1B; pointer-events:none; }
.opt-l { width:22px; height:22px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--text-light); flex-shrink:0; border:1px solid var(--border); }
.validate-btn { margin-top:16px; padding:11px 26px; background:var(--purple); color:white; border:none; border-radius:7px; font-size:13px; font-weight:700; cursor:pointer; transition:all .2s; }
.validate-btn:hover { background:var(--purple-dark); }
.validate-btn:disabled { background:var(--border); color:var(--text-light); cursor:not-allowed; }
.feedback { margin-top:14px; padding:12px 16px; border-radius:7px; font-size:13px; display:none; align-items:flex-start; gap:8px; line-height:1.5; }
.feedback.show { display:flex; }
.feedback.ok { background:#F0FDF4; border:1px solid #86EFAC; color:#166534; }
.feedback.ko { background:#FEF2F2; border:1px solid #FECACA; color:#991B1B; }

/* NAV BUTTONS */
.lesson-nav { display:flex; align-items:center; justify-content:space-between; margin-top:32px; padding-top:22px; border-top:1px solid var(--border); }
.nav-btn { padding:10px 22px; border-radius:7px; font-size:13px; font-weight:700; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:6px; }
.nav-btn.prev { background:white; border:2px solid var(--border); color:var(--text-light); }
.nav-btn.prev:hover { border-color:var(--purple); color:var(--purple); }
.nav-btn.next { background:var(--purple); border:2px solid var(--purple); color:white; }
.nav-btn.next:hover { background:var(--purple-dark); border-color:var(--purple-dark); }
.nav-btn:disabled { opacity:.4; cursor:not-allowed; }

/* WELCOME */
.welcome { padding:60px 48px; max-width:900px; }
.welcome h1 { font-size:34px; font-weight:800; margin-bottom:10px; }
.welcome .sub { color:var(--text-light); font-size:16px; line-height:1.6; max-width:560px; margin-bottom:32px; }
.start-btn { padding:14px 36px; background:var(--purple); color:white; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 16px rgba(102,84,192,.3); transition:all .2s; }
.start-btn:hover { background:var(--purple-dark); transform:translateY(-2px); }
.mod-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:36px; }
.mod-card { background:white; border:1px solid var(--border); border-radius:10px; padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:all .2s; }
.mod-card:hover { border-color:var(--purple); box-shadow:0 2px 8px rgba(102,84,192,.12); }
.mod-card .ic { width:38px; height:38px; background:var(--purple-light); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.mod-card .info .t { font-size:13px; font-weight:700; }
.mod-card .info .s { font-size:11px; color:var(--text-light); }

/* COMPLETE */
.complete { text-align:center; padding:60px 40px; background:white; border-radius:16px; border:2px solid var(--success); }
.complete .trophy { font-size:60px; margin-bottom:16px; }
.complete h2 { font-size:26px; font-weight:800; margin-bottom:8px; }
.complete p { color:var(--text-light); margin-bottom:24px; }

@media(max-width:700px){ .sidebar{display:none} .main{margin-left:0} .content-area,.welcome{padding:24px} .zd-inner{grid-template-columns:1fr} .zd-side{display:none} .mod-grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo" onclick="showWelcome()" style="cursor:pointer">
    <img src="/Users/stephie/Documents/Zendesk/Omycare/Airwell/Omycarelogosinfondo.png" alt="OmyCare" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <div style="display:none;color:white;font-size:20px;font-weight:800;">Omy<span style="color:#a78bfa">Care</span></div>
    <span class="sidebar-label" id="sl-label">Formation Agent</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-top">
      <span id="sl-progress-lbl">Progression</span>
      <strong id="sl-progress-pct">0%</strong>
    </div>
    <div class="pbar"><div class="pbar-fill" id="pbar-fill"></div></div>
  </div>
  <div class="modules-nav" id="modules-nav"></div>
  <div style="padding:12px 18px;border-top:1px solid rgba(255,255,255,0.07);margin-top:auto">
    <button onclick="if(confirm('Reset all progress?')){localStorage.removeItem('zd-done');state.done={};updateProgress();renderSidebar();}" style="background:none;border:none;color:rgba(255,255,255,0.3);font-size:11px;cursor:pointer;padding:0;text-decoration:underline">↺ Reset progress</button>
  </div>
</nav>

<main class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb"><span id="bc-home">Accueil</span></div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-fr" onclick="setLang('fr')">FR</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <div id="page"></div>
</main>

<link rel="stylesheet" href="simulator.css">
<script src="modules.js"></script>
<script src="simulator.js"></script>
<script src="app.js"></script>
</body>
</html>
